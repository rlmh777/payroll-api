services:
    laravel.test:
        container_name: payroll-api
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            CIPHERSWEET_KEY: '${CIPHERSWEET_KEY}'
            AUTH_GUARD: '${AUTH_GUARD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - payroll-network
        depends_on:
            - postgres
            - redis
            - meilisearch
            - mailpit
            - selenium
    scheduler:
        container_name: payroll-scheduler
        image: sail-8.4/app
        entrypoint: []
        command: /bin/bash -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - payroll-network
        depends_on:
            - postgres
            - redis
    queue:
        container_name: payroll-queue
        image: sail-8.4/app
        entrypoint: []
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - payroll-network
        depends_on:
            - postgres
            - redis
    postgres:
        container_name: payroll-db
        image: 'postgres:15-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
        volumes:
            - 'payroll-db:/var/lib/postgresql/data'
        networks:
            - payroll-network
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U ${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        container_name: payroll-redis
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'payroll-redis:/data'
        networks:
            - payroll-network
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        container_name: payroll-meilisearch
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'payroll-meilisearch:/meili_data'
        networks:
            - payroll-network
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        container_name: payroll-mailpit
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - payroll-network
    selenium:
        container_name: payroll-selenium
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - payroll-network
networks:
    payroll-network:
        driver: bridge
volumes:
    payroll-db:
        driver: local
    payroll-redis:
        driver: local
    payroll-meilisearch:
        driver: local
