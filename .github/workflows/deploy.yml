name: Deploy API

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & deploy (${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    env:
      IMAGE_TAG: ${{ github.sha }}
      # Live shared stack (rg-payroll-test / acrpayrolltestgqo0ax were destroyed).
      ACR_NAME: acrpayrollshrdprodi7i0ek
      ACR_LOGIN_SERVER: acrpayrollshrdprodi7i0ek.azurecr.io
      RESOURCE_GROUP: rg-payroll-shrd-prod
      CONTAINER_APP_API: ca-payroll-shrdprod-api
      CONTAINER_APP_QUEUE: ca-payroll-shrdprod-queue
      CONTAINER_APP_SCHEDULER: ca-payroll-shrdprod-scheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Mirror base images into ACR
        run: |
          set -euo pipefail

          ensure_image() {
            local source="$1"
            local image="$2"
            if az acr repository show --name "$ACR_NAME" --image "$image" --output none 2>/dev/null; then
              echo "Using cached ACR image $image"
              return 0
            fi
            echo "Importing $source -> $ACR_NAME/$image"
            local attempt
            for attempt in 1 2 3 4 5; do
              if az acr import --name "$ACR_NAME" --source "$source" --image "$image"; then
                return 0
              fi
              echo "ACR import failed (attempt ${attempt}); retrying..."
              sleep $((attempt * 20))
            done
            echo "Failed to import $source into ACR"
            return 1
          }

          # Import via Azure so GitHub-hosted runners never hit Docker Hub rate limits.
          ensure_image docker.io/dunglas/frankenphp:1-php8.4-bookworm dunglas/frankenphp:1-php8.4-bookworm
          ensure_image docker.io/library/composer:2 composer:2

      - name: Build and push API image
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN_SERVER}/payroll-api:${IMAGE_TAG}"
          LATEST="${ACR_LOGIN_SERVER}/payroll-api:latest"
          FRANKENPHP_IMAGE="${ACR_LOGIN_SERVER}/dunglas/frankenphp:1-php8.4-bookworm"
          COMPOSER_IMAGE="${ACR_LOGIN_SERVER}/composer:2"

          docker build \
            --platform linux/amd64 \
            --file Dockerfile \
            --build-arg "FRANKENPHP_IMAGE=${FRANKENPHP_IMAGE}" \
            --build-arg "COMPOSER_IMAGE=${COMPOSER_IMAGE}" \
            --tag "$IMAGE" \
            --tag "$LATEST" \
            .

          docker push "$IMAGE"
          docker push "$LATEST"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Container Apps
        run: |
          set -euo pipefail
          for app in "$CONTAINER_APP_API" "$CONTAINER_APP_QUEUE" "$CONTAINER_APP_SCHEDULER"; do
            echo "Updating $app -> $IMAGE"
            az containerapp update \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --output none
          done

      - name: Configure Azure Blob Storage
        run: |
          set -euo pipefail
          STORAGE_ACCOUNT="stpayrollshrdprodi7i0ek"
          CONTAINER="chaacreek"

          ACCOUNT_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)

          az storage container create \
            --name "$CONTAINER" \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --auth-mode key \
            --public-access off \
            --output none

          for app in "$CONTAINER_APP_API" "$CONTAINER_APP_QUEUE" "$CONTAINER_APP_SCHEDULER"; do
            az containerapp secret set \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --secrets azure-storage-account-key="$ACCOUNT_KEY" \
              --output none
            az containerapp update \
              --name "$app" \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                "AZURE_STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT" \
                "AZURE_STORAGE_CONTAINER=$CONTAINER" \
                "AZURE_STORAGE_ACCOUNT_KEY=secretref:azure-storage-account-key" \
              --output none
          done

          unset ACCOUNT_KEY

      - name: Ensure API runs migrations and insert-only catalog seed
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_API" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars "RUN_MIGRATIONS=true" "RUN_SEEDERS=true" \
            --output none

      - name: Summary
        run: |
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP_API" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
